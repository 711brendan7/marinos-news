<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IE分析">
<meta name="theme-color" content="#111727">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="ie.webmanifest">
<link rel="apple-touch-icon" href="ie-icon-180.png">
<title>IE分析アプリ</title>
<link rel="stylesheet" href="ie-analyzer.css">
<style>
:root{--ink:#202738;--muted:#727b8d;--line:#e4e7ef;--green:#315bfa;--lime:#dae4ff;--bg:#f7f8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cd9700;outline-offset:3px}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;line-height:1.5;margin-bottom:10px}
h2{font-size:19px;line-height:1.5}
.overline{font-size:11px;letter-spacing:.17em;color:var(--green);font-weight:700;margin-bottom:10px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:8px;padding:13px 20px;background:#315bfa;color:#fff;font-weight:650;font-size:15px}
.secondary{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 17px;color:#315bfa;font-size:14px}
.muted{color:var(--muted);font-size:14px}
.storage-note{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0 0}
main{padding:22px 18px calc(44px + env(safe-area-inset-bottom));max-width:820px;margin:auto}
.topbar{background:#111727;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.topbar b{font-size:15px;font-weight:650}
.topbar span{color:#93a0bb;font-size:11px;letter-spacing:.13em}
/* ログイン */
.gate{min-height:70vh;display:grid;place-items:center;padding:30px 18px}
.gate form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px;width:100%;max-width:340px;text-align:center}
.gate h1{font-size:21px;margin-bottom:4px}
.gate p{color:var(--muted);font-size:13px;margin-bottom:20px}
.gate input{width:100%;text-align:center;font-size:26px;letter-spacing:.5em;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.gate .primary{width:100%}
.gate .err{color:#b4483c;font-size:13px;min-height:1.6em;margin:10px 0 0}
</style>
</head>
<body>
<div class="topbar"><b>IE分析アプリ</b><span>KAIZEN LAB</span></div>
<div class="gate" id="gate" hidden>
  <form id="gate-form">
    <h1>IE分析アプリ</h1>
    <p>暗証番号を入力してください</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="暗証番号">
    <button class="primary" type="submit">開く</button>
    <p class="err" id="gate-err" role="alert"></p>
  </form>
</div>
<main id="main" tabindex="-1" hidden></main>
<script src="ie-analyzer.js" defer></script>
<script>
(function(){
  'use strict';
  var PIN='8888',KEY='ie-analyzer-gate-v1';
  var gate=document.getElementById('gate'),main=document.getElementById('main');
  function unlocked(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
  function start(){
    gate.hidden=true;main.hidden=false;main.dataset.analyzer='1';
    if(typeof IEAnalyzer!=='undefined')IEAnalyzer.open();
    else document.addEventListener('DOMContentLoaded',function(){IEAnalyzer.open()});
  }
  if(unlocked())start();
  else{
    gate.hidden=false;
    document.getElementById('gate-form').addEventListener('submit',function(e){
      e.preventDefault();
      if(document.getElementById('pin').value.trim()===PIN){
        try{localStorage.setItem(KEY,'1')}catch(err){}
        start();
      }else{
        document.getElementById('gate-err').textContent='暗証番号が違います';
        document.getElementById('pin').value='';
      }
    });
  }
  if('serviceWorker' in navigator)
    window.addEventListener('load',function(){navigator.serviceWorker.register('ie-sw.js').catch(function(){})});
})();
</script>
</body>
</html>
